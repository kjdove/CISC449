<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>kjdove</title>
    <style>
       h2 {
        text-align: center;
      }

      .box-row {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 15px;
        margin-bottom: 20px;
      }
      .button1:hover {
        background-image: linear-gradient(90deg, #c2eb9a 0%, #a7cb85 49%, #6b9246 80%, #537a2d 100%);
        animation: slidebg 5s linear infinite;
      }
       .button2:hover {
        background-image: linear-gradient(90deg, #afd5f7 0%, #6cb5f7 49%, #449ff2 80%, #1a87ea 100%);
        animation: slidebg 5s linear infinite;
      }
       .button3:hover {
        background-image: linear-gradient(90deg, #ae94f2 0%, #9772f5 49%, #643dc8 80%, #4d1bcb 100%);
        animation: slidebg 5s linear infinite;
      }
      @keyframes slidebg {
        to {background-position:20vw;}
      }
      
      #image-container {
        display: flex;
        justify-content: center; /* centers image horizontally */
      }

      #image {
        max-width: 300px;
        max-height: 300px;
        object-fit: contain;
        border: 1px solid #ccc;
      }
    </style>
  </head>

  <body>
    <h2>choose a box</h2>
    <div class="box-row">
      <button class='button1' onClick="renderBox(1)">box 1</button>
      <button class='button2' onClick="renderBox(2)">box 2</button>
      <button class='button3' onClick="renderBox(3)">box 3</button>
    </div>

    <div id="image-container">
      <img id="image" src="">
    </div>
    <script>
      function renderBox(boxNum) {
        const imageElement = document.getElementById('image');
        let imageSrc = "";
        switch(boxNum) {
          case 1:
            imageSrc = "spirit.png";
            break;
          case 2:
            imageSrc = "snoopy.png";
            break;
          case 3:
            imageSrc = "clancy.png"
            break;
          default: 
            imageSrc = "";
            alert("invalid box number");
        }
        imageElement.src = imageSrc;
      }
    </script>
  </body>
</html>
